<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Stream Query Viewer</title>
    <style>
        /* ... [CSS für Spinner, etc. bleibt gleich] ... */
        /* Das Lade-DIV (nur für die Optik) */
        #ladeAnzeige {
        margin-top: 0px;
        display: flex;
        align-items: center;
        }

        #ladeAnzeige p {
        margin-left: 10px;
        }

        /* Der eigentliche Spinner */
        .spinner {
        border: 5px solid #f3f3f3; /* Hellgrauer Kreis */
        border-top: 5px solid #3498db; /* Blauer "Lade"-Teil */
        border-radius: 50%;
        width: 7px;
        height: 7px;
        animation: spin 1s linear infinite;
        }

        /* Die CSS-Animation (blockiert nichts) */
        @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
        }

        /* DIV für die Ausgabe */
        .scrollable-div {
            width: 98%;
            height: 200px;
            overflow: auto; /* Enables scrolling */
            border: 1px solid #ccc;
            padding: 10px;
            resize: both;
            background-color: #fdfdfd;
            font-family: 'Courier New', Courier, monospace;
        }

        #table-output {
            height: 300px; /* Etwas mehr Platz für die volle Tabelle */
            margin-top: 10px;
            font-family: Arial, sans-serif; /* Besser lesbare Schrift für Tabelle */
        }

        /* CSS für die JSON-Tabelle */
        .json-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        .json-table th, .json-table td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: left;
            vertical-align: top;
            word-break: break-all;
        }
        .json-table th {
            background-color: #f2f2f2;
            position: sticky; /* Wichtig: Header beim Scrollen fixieren */
            top: 0;
        }
        .json-table tbody tr:hover {
            background-color: #f9f9f9;
        }
        
        /* --- NEU: Style für die Toggle-Buttons --- */
        h3 button {
            font-size: 0.7em;
            font-weight: normal;
            padding: 2px 5px;
            margin-left: 15px;
            cursor: pointer;
        }
    </style>
    <script>
        var cancelled = false;
        let isProgrammaticScroll = false;
        let userScrolled = false;

        // --- Globale Puffer für die Tabellenerstellung ---
        let jsonBuffer = "";     // Puffer für unvollständige JSON-Chunks
        let allData = [];        // Speichert ALLE geparsten Objekte
        let tableHeaders = [];   // Geordnete Liste aller Spalten-Keys
        let isArrayStream = false; // Flag, ob wir in einem JSON-Array parsen

        function prefill(selection) {
            // ... [prefill-Funktion bleibt unverändert] ...
             let text = "";
            if (selection == "List Measurements") {
                text = `Mgmt ListMeasurements`
            } else if (selection == "Regex Zisterne") {
                text = `Load <measure:.*[$].*[$](.*)>: regex:zisterne[$]esp_ping[$].* NewestOnly
Aggr a<measure>: regex:.* Infinite Last
Publ regex:a.* Table`                
            } else if (selection == "Regex Beispiel TempBatt") {
                text = `Load l<measure>: regex:.*Mi.*_.*battery now-1d now NoCache
Load t<measure>: regex:.*Mi.*_.*temperature now-1d now NoCache

Aggr <measure:.*[$]Mi(.*)_.*>_Batt: regex:l.* Infinite Last EmptyWindows
Aggr <measure:.*[$]Mi(.*)_.*>_Temp: regex:t.* Infinite Last EmptyWindows

Publ regex:.*(_Batt|_Temp) Table`
            } else if (selection == "Kala-Fehler") {            
                text = `Load k<measure>: regex:kala.* now-10m now NoCache
Publ regex:k.* Table`
            } else if(selection == "PV Beispiel") {
                text = `#Var $FROM "\${__from:date:iso:YYYY-MM-DDTHH:mm:ss}"
#Var $TO "\${__to:date:iso:YYYY-MM-DDTHH:mm:ss}"
#Var $CACHE Auto(\${__interval_ms})_WAvg_REFRESHINCREMENTAL
#Var $INTERVAL \${__interval_ms}

Var $FROM 2025-01-01T00:00:00
Var $TO 2025-01-02T00:00:00
Var $CACHE NoCache
Var $INTERVAL 3600000

Var $AGG "WAvg EmptyWindows"


Load rPV1: Sofar/measure/PVInput1/0x586_Leistung_PV1[kW] $FROM $TO $CACHE
Load rPV2: Sofar/measure/PVInput1/0x589_Leistung_PV2[kW] $FROM $TO $CACHE
Load rNetz: Sofar/measure/OnGridOutput/0x488_ActivePower_PCC_Total[kW] $FROM $TO $CACHE
Load rAkku: Sofar/measure/batteryInput1/0x606_Power_Bat1[kW] $FROM $TO $CACHE
Load rVerbrauch: Sofar/measure/OnGridOutput/0x4AF_ActivePower_Load_Sys[kW] $FROM $TO $CACHE
Load rPrognoseSolcast: prognose$solcast$50 $FROM $TO NoCache
Load rPrognoseForecast: prognose$forecastsolar $FROM $TO NoCache

Aggr aPV1: rPV1 $INTERVAL $AGG
Aggr aPV2: rPV2 $INTERVAL $AGG
Aggr aNetz: rNetz $INTERVAL $AGG
Aggr aAkku: rAkku $INTERVAL $AGG
Aggr aVerbrauch: rVerbrauch $INTERVAL $AGG
Aggr aAkkuladung: rAkku $INTERVAL $AGG
Aggr aPrognoseSolcast: rPrognoseSolcast  $INTERVAL $AGG
Aggr aPrognoseForecast: rPrognoseForecast  $INTERVAL $AGG

Expr PV: "aPV1.Value + aPV2.Value"
Expr Netzbezug: "aNetz.Value > 0 ? 0 : -aNetz.Value"
Expr Netzeinspeisung: "aNetz.Value < 0 ? 0 : -aNetz.Value"
Expr Akkuentladung: "aAkku.Value > 0 ? 0 : -aAkku.Value"
Expr Akkuladung: "aAkku.Value < 0 ? 0 : -aAkku.Value"
Expr Verbrauch: "-aVerbrauch.Value"
Expr PrognoseSolcast: "aPrognoseSolcast.Value"
Expr PrognoseForecast: "aPrognoseForecast.Value / 1000.0"
Expr Verluste: "-(PV.Value+Netzbezug.Value+Akkuentladung.Value+Verbrauch.Value+Netzeinspeisung.Value+Akkuladung.Value)"

Publ "Netzbezug,PV,Netzeinspeisung,Akkuentladung,Akkuladung,Verbrauch,PrognoseSolcast,PrognoseForecast,Verluste" Table
`
            } else if(selection == "Mgmt Examples") {
                text = `Mgmt FSCHK kala$errors
#Mgmt FSCHK
#Mgmt ListMeasurements
#Mgmt COPY
#Mgmt RENAME
#Mgmt CLEAN
#Mgmt BLACKLIST
#Mgmt UNBLACKLIST
#Mgmt SORTRAWFILES   - UNNÖTIG!
#Mgmt BENCHIO
#Mgmt IMPORTINFLUX
#Mgmt IMPORTTSTSFE
`
            }
            document.getElementById('query').value = text;
            document.getElementById('send').click();
        }

        window.onload = (ev) => {
            // ... [Setup url, clearButton, cancelButton, scroll-Listener bleiben unverändert] ...

            var url = document.getElementById('url');
            var base_url = window.location.origin;
            url.value = base_url + "/" + "api/StreamQuery";
            
            var sendButton = document.getElementById('send');
            sendButton.addEventListener('click', async () => {
                var url = document.getElementById('url');

                var query = document.getElementById('query');
                console.log("URL: " + url.value);
                console.log("QUERY: " + query.value);
                
                // --- Reset für neuen Lauf ---
                cancelled = false;
                jsonBuffer = "";
                allData = [];
                tableHeaders = [];
                isArrayStream = false;
                
                // Tabelle und Output leeren
                document.getElementById('table-output').innerHTML = ""; 
                document.getElementById('output').innerHTML = "";

                // --- NEU: Sicherstellen, dass die Divs bei "Send" sichtbar sind ---
                document.getElementById('table-output').style.display = "block";
                document.getElementById('output').style.display = "block";
                document.getElementById('toggleRaw').innerText = "Verbergen";
                document.getElementById('toggleTable').innerText = "Verbergen";


                let ladeDiv = document.getElementById("ladeAnzeige");
                document.getElementById('send').disabled = true
                ladeDiv.style.display = "inline-flex";
                
                await streamquery(url.value, query.value);
            });
            var clearButton = document.getElementById('clear');
            clearButton.addEventListener('click', async () => {
                const outputDiv = document.getElementById('output');
                outputDiv.innerHTML = "";
                const tableDiv = document.getElementById('table-output');
                tableDiv.innerHTML = "";
            });
            var cancelButton = document.getElementById('cancel');
            cancelButton.addEventListener('click', async () => {
                cancelled = true;
            });
            const scrollableDiv = document.getElementById('output');
            scrollableDiv.addEventListener('scroll', () => {
                if (!isProgrammaticScroll) {                    
                    const isScrolledToBottom = scrollableDiv.scrollHeight - scrollableDiv.clientHeight <= scrollableDiv.scrollTop + 1;
                    if (isScrolledToBottom) {
                        userScrolled = false;
                    } else {
                        userScrolled = true;
                    }
                    // console.log("Der Benutzer hat gescrollt."); // Zu gesprächig
                }
                // Resetting the flag for programmatic scrolls
                isProgrammaticScroll = false;
            });

        }

        /**
         * --- NEU: Schaltet die Sichtbarkeit eines Elements um ---
         */
        function toggleVisibility(elementId, button) {
            const element = document.getElementById(elementId);
            
            if (element.style.display === "none") {
                // Aktuell verborgen -> Anzeigen
                element.style.display = "block"; // 'block' ist der Standard für <div>
                button.innerText = "Verbergen";
            } else {
                // Aktuell sichtbar -> Verbergen
                element.style.display = "none";
                button.innerText = "Anzeigen";
            }
        }

        function autoScroll() {
            // ... [Funktion bleibt unverändert] ...
            const outputDiv = document.getElementById('output');
            if (!userScrolled) {
                // Scroll to bottom
                isProgrammaticScroll = true;
                outputDiv.scrollTop = outputDiv.scrollHeight - 100;
            }
        }

        function resetUI() {
            // ... [Funktion bleibt unverändert] ...
            let ladeDiv = document.getElementById("ladeAnzeige");
            ladeDiv.style.display = "none";
            document.getElementById('send').disabled = false;
            autoScroll(); 
        }

        // --- Tabellen-Logik [bleibt unverändert] ---

        function appendRowToTable(row) {
            const tbody = document.getElementById('json-table-body');
            if (!tbody) return; 

            let html = '<tr>';
            for (const header of tableHeaders) {
                let value = row[header]; 
                
                if (typeof value === 'number') {
                    value = value.toFixed(4); 
                } else if (value === null || typeof value === 'undefined') {
                    value = '<em>null</em>';
                }
                html += `<td>${value}</td>`;
            }
            html += '</tr>';
            tbody.insertAdjacentHTML('beforeend', html);
        }

        function rebuildTableWithNewHeaders() {
            const tableDiv = document.getElementById('table-output');
            
            let html = '<table class="json-table"><thead id="json-table-head"><tr>';
            for (const key of tableHeaders) {
                html += `<th>${key}</th>`;
            }
            html += '</tr></thead>';
            html += '<tbody id="json-table-body">';
            html += '</tbody></table>';
            
            tableDiv.innerHTML = html;

            for (const row of allData) {
                appendRowToTable(row);
            }
        }

        function findCompleteObject(buffer, startIndex) {
            let braceDepth = 0;
            let inString = false;
            let escape = false;

            for (let i = startIndex; i < buffer.length; i++) {
                const char = buffer[i];

                if (escape) {
                    escape = false;
                    continue; 
                }
                if (char === '\\') {
                    escape = true;
                    continue;
                }
                if (char === '"') {
                    inString = !inString;
                    continue;
                }
                if (inString) {
                    continue; 
                }
                if (char === '{') {
                    braceDepth++;
                } else if (char === '}') {
                    braceDepth--;
                    if (braceDepth === 0) {
                        return [ buffer.substring(startIndex, i + 1), i ];
                    }
                }
            }
            return [ null, -1 ];
        }

        function parseAndRenderBuffer() {
            if (!isArrayStream) return; 
            
            let newObjectsFound = false;
            let newHeadersFound = false;

            while(true) { 
                let objectStartIndex = jsonBuffer.indexOf('{');
                if (objectStartIndex === -1) {
                    break; 
                }
                
                const [objectString, objectEndIndex] = findCompleteObject(jsonBuffer, objectStartIndex);

                if (objectString === null) {
                    break; 
                }

                jsonBuffer = jsonBuffer.substring(objectEndIndex + 1);

                try {
                    const parsedObject = JSON.parse(objectString);
                    allData.push(parsedObject); 
                    newObjectsFound = true;

                    const keys = Object.keys(parsedObject);
                    for (const key of keys) {
                        if (!tableHeaders.includes(key)) {
                            tableHeaders.push(key);
                            newHeadersFound = true;
                        }
                    }

                    if (newHeadersFound) {
                        // Wird nach der Schleife aufgerufen
                    } else {
                        appendRowToTable(parsedObject);
                    }

                } catch (e) {
                    console.warn("Konnte JSON-Objekt nicht parsen:", objectString, e);
                }
            } // Ende while(true)

            if (newHeadersFound) {
                rebuildTableWithNewHeaders();
            }
        }


        function datePrefix() {
            return "<span style='color:grey;'>" + new Date().toISOString() + " # </span>";
        }

        async function streamquery(url, query) {
            
            const outputDiv = document.getElementById('output');
            let reader;
            let firstline = true;
            
            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: query,
                })

                if (!response.body) {
                    console.error('ReadableStream not supported in this browser.');
                    outputDiv.innerHTML += "<br/>" + datePrefix() + "<span style='color:red;'>ReadableStream not supported!</span><br/>";
                    resetUI();
                    return;
                }

                reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                
                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) {
                        console.log('Stream complete');                    
                        outputDiv.innerHTML += "<br/>" + datePrefix() + "Stream Complete ===========================<br/>"
                        resetUI();
                        break; 
                    }

                    const chunk = decoder.decode(value, { stream: true });
                    
                    if (firstline) {
                        outputDiv.innerHTML += "<br/>" + datePrefix() + "Stream Start ===========================<br/>"
                        if (chunk.trim().startsWith("[")) {
                            isArrayStream = true;
                            rebuildTableWithNewHeaders(); 
                        }
                        firstline = false;
                    }

                    outputDiv.innerHTML += chunk.replaceAll("{", "<br>" + datePrefix() + "{");                
                    autoScroll();

                    if (isArrayStream) {
                        jsonBuffer += chunk; 
                        parseAndRenderBuffer(); 
                    }

                    if (cancelled) {
                        reader.cancel("user");
                        outputDiv.innerHTML += "<br/>" + datePrefix() + "Stream Cancelled ===========================<br/>"
                        resetUI();
                        break; 
                    }
                }

            } catch (error) {
                if (!cancelled) { 
                    console.error('Stream query failed:', error);
                    outputDiv.innerHTML += "<br/>" + datePrefix() + `<span style='color:red;'>Stream Failed/Aborted: ${error.message}</span> ===========================<br/>`;
                } else {
                    console.log("Stream cancelled by user.");
                }
                resetUI();
            }
        }
    </script>
</head>
<body>
    URL: <br />
    
    <input id="url" value="http://server/api/StreamQuery" size="80"></input><br />
    Query: <br />
    <table>
        <tr>            
            <td><textarea id="query" name="Text1" cols="80" rows="15" spellcheck="false">Mgmt ListMeasurements</textarea></td>
            <td style="vertical-align: top;">
                <a href="#" onClick="prefill('Kala-Fehler');">Kala-Fehler Und Logs</a><br>
                <a href="#" onClick="prefill('List Measurements');">List Measurements</a><br>
                <a href="#" onClick="prefill('PV Beispiel');">PV Beispiel</a><br>
                <a href="#" onClick="prefill('Mgmt Examples');">Mgmt Examples</a><br>
                <a href="#" onClick="prefill('Regex Beispiel TempBatt');">Regex Beispiel TempBatt</a><br>
                <a href="#" onClick="prefill('Regex Zisterne');">Regex Zisterne</a><br>
                
            </td>
        </tr>
    </table>
    
    <br />
    <button id="send">Send</button>&nbsp;<div id="ladeAnzeige" style="display: none;"><div class="spinner"></div></div>&nbsp;<button id="cancel">Cancel</button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<button id="clear">Clear</button>
    
    <h3>Raw Stream Output:
        <button id="toggleRaw" onclick="toggleVisibility('output', this)">Verbergen</button>
    </h3>
    <div id="output" class="scrollable-div"></div>
    
    <h3>Vollständige Tabellendaten (Live):
        <button id="toggleTable" onclick="toggleVisibility('table-output', this)">Verbergen</button>
    </h3>
    <div id="table-output" class="scrollable-div"></div>

</body>
</html>
